# ⚠️ 프로젝트 이름을 **파일에 박는다**. 없으면 compose 는 디렉터리 이름(bebe-moment)을
# 프로젝트로 쓰는데, 그건 dev/라이브 스택과 같은 이름이다. 그래서 `-p` 없이
# `docker compose -f docker-compose.e2e.yml down` 을 한 번 치면 e2e 가 아니라 **라이브
# postgres 컨테이너**가 내려간다(2026-09-10 실제로 그렇게 내렸다. 데이터는 바인드
# 마운트라 살았지만 인스턴스는 멈췄다). run-smoke.sh 는 `-p bebe-e2e` 를 넘기지만,
# 사람이 직접 치는 명령까지 지켜 주지는 못한다.
name: bebe-e2e

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bebe
      POSTGRES_USER: bebe
      POSTGRES_PASSWORD: bebe
    # 호스트 포트·볼륨 모두 dev/운영과 다르다. e2e 는 시작할 때 DB 를 통째로 비우므로,
    # 같은 컨테이너를 공유하면 실제 가족 사진이 지워진다 — 이 리포에서 "dev DB" 라 부르는
    # 것이 셀프호스팅 인스턴스에서는 그대로 프로덕션인 경우가 있다.
    ports:
      - '55432:5432'
    tmpfs:
      # 디스크에 남기지 않는다 — 끝나면 사라지는 게 맞고, 실수로 재사용될 여지도 없앤다.
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bebe']
      interval: 3s

  redis:
    image: valkey/valkey:9-alpine
    ports:
      - '56379:6379'
