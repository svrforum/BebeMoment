services:
  postgres:
    # pgvector 확장 포함(얼굴 임베딩 벡터검색).
    # ⚠️ pg16 고정 — ./.dev/pg 볼륨은 pg16 데이터 디렉터리이고, 이 호스트에서는 그 볼륨이
    #    곧 라이브 인스턴스의 DB 다. pg17 이미지는 pg16 볼륨을 못 읽어 크래시 루프가 된다.
    #    프로덕션 compose 는 pg17 이다. 올리려면 docs/operations.md 의
    #    "Upgrading Postgres 16 → 17"(앱 이미지의 pg17 클라이언트로 pg_dump → 새 볼륨에 복원)을
    #    따른 뒤 여기 태그를 바꾼다.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bebe
      POSTGRES_USER: bebe
      POSTGRES_PASSWORD: bebe
    ports:
      - "5432:5432"
    volumes:
      - ./.dev/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebe"]
      interval: 5s

  redis:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.dev/redis:/data
