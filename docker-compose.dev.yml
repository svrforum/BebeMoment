services:
  postgres:
    # pgvector 확장 포함(얼굴 임베딩 벡터검색).
    # ⚠️ pg16 → pg17 메이저 업: 데이터 디렉터리 비호환 — pg17 가 pg16 볼륨을 못 읽는다.
    #    기존 데이터는 pg_dump(16)→restore(17) 또는 pg_upgrade 로 옮기고 ./.dev/pg 를 비울 것.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bebe
      POSTGRES_USER: bebe
      POSTGRES_PASSWORD: bebe
    ports:
      - "5432:5432"
    volumes:
      - ./.dev/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebe"]
      interval: 5s

  redis:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.dev/redis:/data
