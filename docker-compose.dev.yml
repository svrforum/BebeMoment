# 이 파일이 곧 라이브 스택이다. 프로젝트 이름을 명시해 e2e 스택(bebe-e2e)과
# 절대 겹치지 않게 한다 — 값은 지금까지 쓰던 디렉터리 기본값과 같아 컨테이너 이름은
# 그대로다.
name: bebe-moment

services:
  postgres:
    # pgvector 확장 포함(얼굴 임베딩 벡터검색).
    # ⚠️ pg16 고정 — ./.dev/pg 볼륨은 pg16 데이터 디렉터리이고, 이 호스트에서는 그 볼륨이
    #    곧 라이브 인스턴스의 DB 다. pg17 이미지는 pg16 볼륨을 못 읽어 크래시 루프가 된다.
    #    프로덕션 compose 는 pg17 이다. 올리려면 docs/operations.md 의
    #    "Upgrading Postgres 16 → 17"(앱 이미지의 pg17 클라이언트로 pg_dump → 새 볼륨에 복원)을
    #    따른 뒤 여기 태그를 바꾼다.
    image: pgvector/pgvector:pg16
    # 이 컨테이너가 라이브 DB 라 호스트 재부팅 뒤에도 다시 떠야 한다. 정책이 없어
    # 2026-11-12 재부팅 후 34시간 동안 app 이 DB 를 못 찾고 재시작만 반복했다.
    restart: unless-stopped
    environment:
      POSTGRES_DB: bebe
      POSTGRES_USER: bebe
      POSTGRES_PASSWORD: bebe
    # 호스트 안에서만 연다 — 앱 컨테이너는 도커 네트워크(postgres:5432)로 붙는다.
    # 0.0.0.0 이면 같은 네트워크의 누구나 이 계정·비밀번호로 접속을 시도할 수 있다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.dev/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebe"]
      interval: 5s

  redis:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./.dev/redis:/data
