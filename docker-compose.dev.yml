services:
  postgres:
    # pgvector 확장 포함(얼굴 임베딩 벡터검색). pg16 동일이라 데이터 볼륨 그대로 호환.
    # (이 인스턴스는 alpine→debian 전환 시 데이터 소유권을 999 로 chown + REINDEX 했음.)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bebe
      POSTGRES_USER: bebe
      POSTGRES_PASSWORD: bebe
    ports:
      - "5432:5432"
    volumes:
      - ./.dev/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebe"]
      interval: 5s

  redis:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.dev/redis:/data
