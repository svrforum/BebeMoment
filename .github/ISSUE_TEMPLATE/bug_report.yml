name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Security vulnerability?** Do not file it here — see [SECURITY.md](../../SECURITY.md) for private reporting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / image tag
      description: The `v0.0.x` tag or APP_VERSION (`docker inspect bebe-app`).
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options: [Synology DSM, Linux Docker Compose, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker logs bebe-app` around the failure. Redact secrets."
      render: shell
