version: 2
updates:
  # npm/pnpm dependencies (root workspace)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # batch low-risk dev/tooling bumps into one PR to cut noise
      dev-dependencies:
        dependency-type: development
      # The three AWS packages share one version range and one type surface.
      # Bumping the presigner alone put two SDK trees in the lockfile and broke
      # typecheck — getSignedUrl saw two incompatible Client classes (PR #9).
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
    ignore:
      # pinned intentionally (see pnpm-workspace overrides / single React copy)
      - dependency-name: react
      - dependency-name: react-dom
      # Types must not run ahead of the runtime: we ship Node 22 LTS, and types
      # for a newer Node let a missing API typecheck and then fail in production.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images in the app + ml Dockerfiles
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # LTS only. Dependabot cannot tell an LTS line from an odd-numbered one and
      # proposed Node 25, which was already end-of-life (PR #14). Major moves are
      # a deliberate call — 22 -> 24, or 26 once it reaches LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /apps/ml
    schedule:
      interval: weekly
    ignore:
      # The numpy 1.26/cp312 reason is gone (the sidecar runs Python 3.13 and
      # numpy 2.x), but the other half still holds: nothing builds this image
      # until a tag is pushed, so a bad base bump surfaces mid-release. Majors
      # stay a deliberate call; minors now ride in.
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  # Python packages of the ML sidecar (apps/ml/requirements.txt) — the only
  # dependency file Dependabot was not watching.
  - package-ecosystem: pip
    directory: /apps/ml
    schedule:
      interval: weekly
    # insightface is pinned in requirements-insightface.txt (installed with
    # --no-deps so its GUI opencv and training extras stay out of the image).
    # A stack bump must be validated by re-embedding the fixture faces and
    # comparing cosine similarity against the stored vectors — see apps/ml/README.md.
