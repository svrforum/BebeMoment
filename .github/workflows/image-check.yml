name: Image build check
# Dockerfile·entrypoint·얼굴인식 사이드카 변경과 베이스 이미지 bump 는 예전엔 v* 태그를 민 뒤
# release.yml 에서야 처음 빌드됐다. 이미지에 영향을 주는 경로가 바뀌면 여기서 푸시 없이 빌드만
# 해 본다. 캐시는 release 와 같은 범위를 읽기만 한다.
on:
  pull_request:
    paths:
      - 'docker/**'
      - 'apps/ml/**'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/image-check.yml'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'apps/ml/**'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/image-check.yml'
concurrency:
  group: image-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=app

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/ml
          file: apps/ml/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ml
