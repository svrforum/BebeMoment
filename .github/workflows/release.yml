name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bebe
          POSTGRES_PASSWORD: bebe
          POSTGRES_DB: bebe
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U bebe"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://bebe:bebe@localhost:5432/bebe
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-32-bytes-minimum-ok-padding
      PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bebe/db-public exec prisma generate
      - run: pnpm --filter @bebe/db-media  exec prisma generate
      - run: pnpm --filter @bebe/db-public exec prisma migrate deploy
      - run: pnpm --filter @bebe/db-media  exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r --filter '!@bebe/e2e' test

  build:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          provenance: true
          sbom: true

  android:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: App version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf 'versionName=%s\nversionCode=%s\n' "$VERSION" "${GITHUB_RUN_NUMBER}" \
            > android-app/android/version.properties
          cat android-app/android/version.properties
      - name: Write signing config from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS_PATH="$GITHUB_WORKSPACE/android-app/android/bebe-release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$KS_PATH"
          {
            echo "storeFile=$KS_PATH"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=bebe"
            echo "keyPassword=$KS_PASS"
          } > android-app/android/keystore.properties
      - name: Build signed release APK
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android-app/android/app/build/outputs/apk/release/app-release.apk \
            "dist/bebe-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bebe-apk
          path: dist/*.apk

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bebe-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
