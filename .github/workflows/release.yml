name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bebe
          POSTGRES_PASSWORD: bebe
          POSTGRES_DB: bebe
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U bebe"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://bebe:bebe@localhost:5432/bebe
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-32-bytes-minimum-ok-padding
      PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bebe/db-public exec prisma generate
      - run: pnpm --filter @bebe/db-media  exec prisma generate
      - run: pnpm --filter @bebe/db-public exec prisma migrate deploy
      - run: pnpm --filter @bebe/db-media  exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:lines
      - run: pnpm -r --filter '!@bebe/e2e' test

  build:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ARM64 (Synology DSM ARM NAS) 는 현재 타깃 아님 — QEMU 에뮬레이션 비용
      # 제거(17분 → 5분대). 필요해지면 setup-qemu-action 다시 추가하고
      # platforms 에 linux/arm64 추가.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          # 이미지 이름은 리포 캐싱(BebeMoment)과 분리해 **소문자 하이픈 경로로 고정**한다.
          # github.repository 를 그대로 쓰면 ghcr.io/svrforum/bebemoment/app(하이픈X)로
          # 푸시돼, compose 기본값·README 가 가리키는 ghcr.io/svrforum/bebe-moment/app 와
          # 어긋나 기본 설치자가 stale 이미지를 받는다(2026-06 회귀).
          images: ghcr.io/${{ github.repository_owner }}/bebe-moment/app
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          # 베이스 이미지를 매 빌드 새로 pull — node/debian apt 레이어가 캐시에 영구
          # 고정돼 OS CVE 패치가 릴리즈마다 안 들어가던 문제 완화.
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          provenance: true
          sbom: true

  # 얼굴 인식 ML 사이드카(옵트인). app 과 별개 이미지로 발행 — faces 켠 인스턴스만 pull.
  ml:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          # app 과 동일 — 소문자 하이픈 경로로 고정(compose/README 정합).
          images: ghcr.io/${{ github.repository_owner }}/bebe-moment/ml
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/ml
          file: apps/ml/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,scope=ml,mode=max
          # app 이미지와 동일하게 공급망 메타데이터 첨부.
          provenance: true
          sbom: true

  # 안드로이드 APK 는 이 web 릴리즈(v* 태그)에서 빌드하지 않는다 — 앱은 별도 `android-v*`
  # 채널(로컬 서명 빌드 + gh release, 인앱 배너가 읽는 유일 채널)로만 배포한다. 과거엔 이
  # 잡이 v* 태그마다 semver 파생 versionCode(예: v0.0.54→54) APK 를 v* 릴리즈에 붙여,
  # android-v* 채널(versionCode 다른 산식)과 충돌 — CI APK 설치자가 android-v* 로 업데이트할
  # 때 다운그레이드 거부로 막다른 길이 됐다. 채널을 android-v* 하나로 단일화했다.

  release:
    needs: [build, ml]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
