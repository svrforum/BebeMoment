# Synology DSM 변형 — 공유 폴더 기준 볼륨 경로 + PUID/PGID 기본값
# 사용: docker-compose.yml 과 함께 override 로 병합
#   docker compose -f docker-compose.yml -f docker-compose.synology.yml up -d
services:
  app:
    volumes:
      - /volume1/docker/bebe-moment/data:/data
    environment:
      PUID: 1026
      PGID: 100
  postgres:
    volumes:
      - /volume1/docker/bebe-moment/pg:/var/lib/postgresql/data
  redis:
    volumes:
      - /volume1/docker/bebe-moment/redis:/data
