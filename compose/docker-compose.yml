services:
  app:
    image: ghcr.io/${GITHUB_REPO:-svrforum/bebe-moment}/app:${TAG:-latest}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://bebe:${POSTGRES_PASSWORD}@postgres:5432/bebe
      DATABASE_URL_WEB: postgres://bebe_web:${BEBE_WEB_DB_PASSWORD}@postgres:5432/bebe
      DATABASE_URL_MEDIA: postgres://bebe_media:${BEBE_MEDIA_DB_PASSWORD}@postgres:5432/bebe
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      # 알림 방해금지·일일 다이제스트·오전 추억 푸시는 컨테이너 로컬 시각으로 판단한다.
      # 가족 시간대로 맞춰야 한밤중(또는 한낮)에 잘못 보내거나 막지 않는다(기본 한국).
      TZ: ${TZ:-Asia/Seoul}
      # web 서버사이드가 같은 컨테이너의 media 로 호출(런타임) + Next /media rewrite(빌드)
      MEDIA_INTERNAL_URL: http://localhost:3001
      # ⚠️ 미디어를 별도 호스트로 분리할 때만 설정. 비워두면 signed URL 이 상대경로
      # (/media/...)라 브라우저가 현재 오리진(IP/도메인) 기준으로 가져간다 — PUBLIC_URL 로
      # 자동 채우면 http IP↔https 도메인 불일치(mixed-content)로 이미지가 안 뜨는 회귀가
      # 단일포트 기본 배포에서 재발한다(signed-url.ts 참고). 그래서 폴백을 두지 않는다.
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN}
      MEDIA_JWT_SECRET: ${MEDIA_JWT_SECRET}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      STORAGE_PATH: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ADMIN_USER_EMAIL: ${ADMIN_USER_EMAIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BEBE_WEB_DB_PASSWORD: ${BEBE_WEB_DB_PASSWORD}
      BEBE_MEDIA_DB_PASSWORD: ${BEBE_MEDIA_DB_PASSWORD}
      # 얼굴 인식(옵트인) ML 사이드카 주소. faces 프로파일을 안 켜면 ml 컨테이너가 없어
      # 호출도 없다(잡 자체가 features.faces 켜졌을 때만 enqueue 됨).
      FACE_ML_URL: ${FACE_ML_URL:-http://ml:8000}
      # 백업 저장 위치(컨테이너 내부). BACKUP_DIR 볼륨을 호스트/시놀로지 공유폴더로 매핑.
      BACKUP_DIR: /backups
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2560m}

  postgres:
    # pgvector 확장 포함(얼굴 인식 임베딩 벡터검색). 신규 설치는 그대로, 기존 alpine
    # 데이터에서 올리는 경우 데이터 소유권을 999(debian postgres)로 chown 후 사용.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bebe
      POSTGRES_USER: bebe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PG_DIR:-./pg}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebe"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-512m}

  # 얼굴 인식 ML 사이드카 — **옵트인**. `docker compose --profile faces up -d` 로만 기동한다.
  # features.faces 끈 인스턴스는 이 컨테이너를 안 띄우므로 부담 0. insightface 모델팩은
  # 첫 기동 때 받아 ml-models 볼륨에 캐시(이후 오프라인). amd64 CPU 추론, 8GB 면 여유.
  ml:
    image: ghcr.io/${GITHUB_REPO:-svrforum/bebe-moment}/ml:${TAG:-latest}
    profiles: ["faces"]
    environment:
      FACE_MODEL_PACK: ${FACE_MODEL_PACK:-buffalo_l}
      # 아기 얼굴 탐지율 ↑ — det_size 크게 + det_thresh 낮게(apps/ml/main.py 참조).
      FACE_DET_SIZE: ${FACE_DET_SIZE:-800}
      FACE_DET_THRESH: ${FACE_DET_THRESH:-0.3}
      # 오탐 제거 후처리 — 아주 작은 탐지(비-얼굴) 컷.
      FACE_MIN_SIZE: ${FACE_MIN_SIZE:-0.05}
      FACE_MIN_SCORE: ${FACE_MIN_SCORE:-0.5}
    volumes:
      - ${ML_MODELS_DIR:-./ml-models}:/data/insightface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${ML_MEMORY_LIMIT:-3g}

  redis:
    # Valkey (Redis BSD 포크) — BullMQ/ioredis 와 RESP 프로토콜 호환, 셀프호스팅에 라이선스
    # 깔끔. 서비스명은 redis 유지(REDIS_URL=redis://redis:6379 그대로).
    # ⚠️ Redis 7.4+ 에서 옮길 땐 기존 dump.rdb(RDB v12)를 Valkey 9 가 못 읽는다 —
    #    REDIS_DIR 볼륨을 비우고 시작할 것. 큐/pub-sub 데이터는 일시적이라 손실 무방.
    image: valkey/valkey:9-alpine
    volumes:
      - ${REDIS_DIR:-./redis}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-128m}
