packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# pnpm 10+ 부터 설정이 package.json 의 "pnpm" 필드에서 이리로 이동했다.
# React 중복 방지(§17#17) — 단일 버전 핀. 의존성 추가로 React 가 갈라지면 여기서 갱신.
overrides:
  react: 19.2.6
  react-dom: 19.2.6

# pnpm 10+ 는 의존성 빌드 스크립트를 기본 차단하고, 허용 안 된 게 있으면 설치를 실패시킨다
# (ERR_PNPM_IGNORED_BUILDS). pnpm 9 시절엔 전부 자동 실행됐으므로, 그때 빌드되던 패키지를
# 명시 허용(true)해 동일 동작 복원. prisma/sharp/esbuild=필수, 나머지는 네이티브 가속 옵션.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: true
  esbuild: true
  cpu-features: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  # next-intl 이 끌어온 네이티브 가속 — 런타임 불필요(JS 폴백). 빌드 스크립트 실행 안 함.
  '@parcel/watcher': false
  '@swc/core': false
