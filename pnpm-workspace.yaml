packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# pnpm 10+ 부터 설정이 package.json 의 "pnpm" 필드에서 이리로 이동했다.
# React 중복 방지 — 단일 버전 핀(두 벌이 되면 next build 의 프리렌더가 깨진다).
# 의존성 추가로 React 가 갈라지면 여기서 갱신.
overrides:
  react: 19.2.6
  react-dom: 19.2.6
  # @prisma/config 7.10.1 이 effect 3.20.0 을 고정한다 — Schema.TemplateLiteral ReDoS(GHSA-7589-6fvf-x4pw)
  # 수정판으로 같은 3.x 안에서 올린다. 범위 선택자라 Prisma 가 3.22.1+ 로 올리면 저절로 무의미해진다.
  'effect@<3.22.1': ^3.22.4

# pnpm 10+ 는 의존성 빌드 스크립트를 기본 차단하고, 허용 안 된 게 있으면 설치를 실패시킨다
# (ERR_PNPM_IGNORED_BUILDS). pnpm 9 시절엔 전부 자동 실행됐으므로, 그때 빌드되던 패키지를
# 명시 허용(true)해 동일 동작 복원. prisma/sharp/esbuild=필수, 나머지는 네이티브 가속 옵션.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: true
  esbuild: true
  cpu-features: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  # next-intl 이 끌어온 네이티브 가속 — 런타임 불필요(JS 폴백). 빌드 스크립트 실행 안 함.
  '@parcel/watcher': false
  '@swc/core': false
